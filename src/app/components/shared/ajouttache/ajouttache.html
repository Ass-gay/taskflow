<section class="ajout-tache">
  <div class="container">

    <h2>Ajouter une tâche</h2>

    <p class="sous-titre">
      Ajoutez une nouvelle tâche à votre planning.
    </p>

    <div class="form">

      <div class="form-row">

        <div class="form-group">

          <label for="titre">Titre de la tâche</label>
          <input type="text" placeholder="Ex : Préparer le cours Angular">

        </div>

        <div class="form-group">
            <label for="priorite">Priorité</label>

            <select id="priorite">
              <option>Faible</option>
              <option selected>Moyenne</option>
              <option>Haute</option>
            </select>
          </div>

      </div>

      <!-- Description -->
      <div class="form-group description">
        <label for="description">Description</label>

        <textarea
          id="description"
          placeholder="Décrivez brièvement votre tâche..."
        ></textarea>
      </div>

      <!-- Bouton -->
      <div class="button-container">
        <button type="button">
          Ajouter la tâche
        </button>
      </div>

    </div>
  </div>
</section>
